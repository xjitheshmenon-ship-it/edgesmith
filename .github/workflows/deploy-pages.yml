name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish by pushing the built site to the gh-pages branch. This routes around
# the GitHub Pages "environment" deployment path (actions/deploy-pages), which
# was intermittently getting stuck in `deployment_queued` and never publishing.
# Repo setting required once: Settings → Pages → Source = "Deploy from a branch"
# → gh-pages / (root).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          # Served under https://<owner>.github.io/edgesmith/ — fed to Vite's
          # `base` and to React Router via import.meta.env.BASE_URL.
          VITE_BASE_PATH: /edgesmith/
          # Backend API base. The API client appends bare paths (e.g. /auth/login)
          # to this, so it MUST include the /api/v1 suffix. Override anytime via a
          # repo Actions variable (Settings → Secrets and variables → Actions →
          # Variables: VITE_API_BASE_URL); falls back to the Render backend below.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://edgesmith-backend.onrender.com/api/v1' }}
        run: npm run build

      # BrowserRouter deep-links (e.g. /edgesmith/dashboard) 404 on GitHub Pages
      # without a SPA fallback; serving index.html as 404.html fixes refreshes.
      # .nojekyll keeps Pages from ignoring asset paths.
      - name: SPA fallback + nojekyll
        working-directory: frontend
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        working-directory: frontend/dist
        run: |
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
